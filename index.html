<!doctype html>
<html lang="it" class="dark" data-accent="emerald">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>GymTimer Pro - Scheda & Timer Riposo</title>
    <script>
      try {
        const s = JSON.parse(localStorage.getItem('gym_settings_v1') || '{}');
        if (s.accentColor) document.documentElement.setAttribute('data-accent', s.accentColor);
        if (s.theme === 'light') document.documentElement.classList.replace('dark', 'light');
      } catch (e) {}
    </script>
    
    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GymTimer" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icon.svg" color="#10b981" />
  </head>
  <body class="bg-[#090d16] text-slate-100 min-h-screen antialiased select-none selection:bg-emerald-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
